app = "kasa-dernek"          # must be globally unique; change if taken
primary_region = "fra"

[build]

[env]
  KASA_DATA = "/data"
  KASA_CLIENT_IP_HEADER = "fly-client-ip"   # set by Fly's proxy, cannot be forged by clients
  # only Fly's private network (6PN fdaa::/16, 172.16.0.0/16) may supply that header; if the proxy comes from
  # elsewhere the header is ignored and the socket address is used (fails safe: shared limit, no spoofing)
  KASA_TRUSTED_PROXIES = "fdaa::/16,172.16.0.0/16"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"    # data lives on the volume, so stopping when idle is safe
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "kasa_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
