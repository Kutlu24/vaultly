services:
  - type: web
    name: kasa
    runtime: docker
    plan: starter            # persistent disks are not available on the free plan
    numInstances: 1          # SQLite: never scale beyond one instance
    healthCheckPath: /api/status
    envVars:
      - key: KASA_DATA
        value: /data
      - key: PORT
        value: "8000"
      # one trusted proxy hop that appends the real client IP to X-Forwarded-For (verify after deploy, see README)
      - key: KASA_PROXY_HOPS
        value: "1"
    disk:
      name: kasa-data
      mountPath: /data
      sizeGB: 1
