services:
  kasa:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8011:8000"]   # put HTTPS in front (tailscale serve / Caddy); WebCrypto needs a secure context
    environment:
      KASA_PROXY_HOPS: "1"   # one local proxy in front (tailscale serve / Caddy); port is bound to 127.0.0.1 only
    volumes: ["./data:/data"]
